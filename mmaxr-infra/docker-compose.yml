name: mmaxr-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      LRSQL_POSTGRES_PASSWORD: ${LRSQL_POSTGRES_PASSWORD:?Set LRSQL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sql-lrs:
    image: lrsql-arm64:local # <--- YOUR NATIVE ARM64 BUILD
    command: ["/lrsql/bin/run_postgres.sh"]
    environment:
      LRSQL_API_KEY_DEFAULT: ${LRS_KEY:?Set LRS_KEY in .env}
      LRSQL_API_SECRET_DEFAULT: ${LRS_SECRET:?Set LRS_SECRET in .env}
      LRSQL_ADMIN_USER_DEFAULT: ${LRS_ADMIN_USER:?Set LRS_ADMIN_USER in .env}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN_PASSWORD:?Set LRS_ADMIN_PASSWORD in .env}
      LRSQL_DB_HOST: postgres
      LRSQL_DB_PORT: "5432"
      LRSQL_DB_NAME: lrsql
      LRSQL_DB_USER: lrsql
      LRSQL_DB_PASSWORD: ${LRSQL_POSTGRES_PASSWORD:?Set LRSQL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${LRS_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data: