# Yet Analytics SQL LRS + its own Postgres, for the spare laptop (amd64 or arm64).
#   docker compose -f deploy/docker-compose.lrs.yml --env-file deploy/.env.lrs up -d
# xAPI endpoint: http://localhost:8090/xapi   (admin UI: http://localhost:8090)
name: mmaxr-lrs
services:
  lrs-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      LRSQL_POSTGRES_PASSWORD: ${LRSQL_POSTGRES_PASSWORD}
    volumes:
      - lrs-pg-data:/var/lib/postgresql/data
      - ../mmaxr-infra/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sql-lrs:
    image: yetanalytics/lrsql:v0.9.12
    command: ["/lrsql/bin/run_postgres.sh"]
    environment:
      LRSQL_API_KEY_DEFAULT: ${LRS_KEY}
      LRSQL_API_SECRET_DEFAULT: ${LRS_SECRET}
      LRSQL_ADMIN_USER_DEFAULT: ${LRS_ADMIN_USER}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN_PASSWORD}
      LRSQL_DB_HOST: lrs-postgres
      LRSQL_DB_PORT: "5432"
      LRSQL_DB_NAME: lrsql
      LRSQL_DB_USER: lrsql
      LRSQL_DB_PASSWORD: ${LRSQL_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${LRS_HOST_PORT:-8090}:8080"
    depends_on:
      lrs-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lrs-pg-data:
