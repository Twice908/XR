<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMAXR Lab - WebXR</title>
    <style>
      body { margin: 0; overflow: hidden; background-color: #000; }
      canvas { display: block; width: 100vw; height: 100vh; }
      
      #ui-panel {
        position: absolute; top: 10px; left: 10px; color: white;
        font-family: monospace; background: rgba(0,0,0,0.7); padding: 15px;
        border-radius: 8px; pointer-events: none; z-index: 100;
      }

      /* The AI Chat Overlay */
      #ai-chat {
        position: absolute; bottom: 20px; right: 20px; width: 300px;
        background: rgba(20, 20, 20, 0.9); border: 1px solid #444;
        border-radius: 8px; font-family: system-ui, sans-serif; 
        display: flex; flex-direction: column; z-index: 100;
      }
      #chat-history {
        height: 150px; overflow-y: auto; padding: 10px; font-size: 14px;
        color: #ddd; border-bottom: 1px solid #444;
      }
      .user-msg { color: #60a5fa; margin-bottom: 5px; }
      .ai-msg { color: #4ade80; margin-bottom: 5px; }
      
      #chat-input-area { display: flex; padding: 10px; gap: 5px; }
      #chat-input {
        flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #555;
        background: #222; color: white; outline: none;
      }
      #send-btn {
        padding: 8px 12px; background: #3b82f6; color: white; border: none;
        border-radius: 4px; cursor: pointer;
      }
      #send-btn:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <div id="ui-panel">
      <h3>MMAXR Spectral Lab</h3>
      <p>Status: <span id="status">IDLE</span></p>
      <p>Instruction: <span id="instruction">Click the glowing screen to Predict</span></p>
    </div>

    <!-- The AI Chat Overlay -->
    <div id="ai-chat">
      <div id="chat-history">
        <div class="ai-msg"><strong>Coach:</strong> I am here to help. What did you predict?</div>
      </div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask the coach..." />
        <button id="send-btn">Send</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
